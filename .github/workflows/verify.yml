name: Verify build

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!claude/persian-school-task-app-c25gaw'
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        continue-on-error: true
        run: npm run lint
      - name: Typecheck
        run: npx tsc -b
      - name: Build
        run: npm run build
