<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فعالیت سوم: جامد، مایع، گاز</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Vazirmatn", "Tahoma", sans-serif;
      background: #faf3e4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .link-card {
      background: #fffaf0;
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 8px 24px rgba(60, 40, 20, 0.12);
      border: 1.5px solid #eadfc4;
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    .link-card h1 {
      font-size: 1.5rem;
      color: #4a2f1c;
      margin-bottom: 8px;
    }
    .link-card p {
      color: #6b4a2f;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }
    .link-card a {
      display: inline-block;
      background: #4a8c5e;
      color: #fff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.1rem;
      transition: filter 0.15s ease;
    }
    .link-card a:hover {
      filter: brightness(1.1);
    }
  </style>
</head>
<body>
  <div class="link-card">
    <h1>فعالیت سوم: جامد، مایع، گاز</h1>
    <p>برای شروع فعالیت روی لینک زیر کلیک کنید</p>
    <a href="https://view.genially.com/6a59fe5f05bae8182ff49b9d">شروع فعالیت 🧪</a>
  </div>
</body>
</html>
